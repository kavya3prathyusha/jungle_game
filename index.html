<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Learning Adventure</title>
    <style>
        body {
            background-color: #8bc34a;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .title {
            font-size: 24px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        .game-section {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .zone {
            width: 30%;
            padding: 20px;
            background-color: #FFD700;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }
        .zone:hover {
            background-color: #FFB300;
        }
        .game-area {
            margin-top: 30px;
            padding: 20px;
            background-color: #f4f4f4;
            border-radius: 10px;
            display: none;
        }
        .word-option, .sentence-option {
            padding: 10px;
            margin: 5px;
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Welcome to Jungle Learning Adventure!</h1>
        <p>Select a learning zone:</p>
        <div class="game-section">
            <div class="zone" onclick="startEnglishZone()">English Zone</div>
            <div class="zone" onclick="startMathZone()">Math Zone</div>
            <div class="zone" onclick="startLogicZone()">Logic Zone</div>
        </div>
        
        <div class="game-area" id="englishGame">
            <h2>English Learning Activities</h2>
            <h3>Spelling Trees</h3>
            <p>Select the correct letters to form a word:</p>
            <div class="word-option" onclick="playWordPhonics('cat')">C A T</div>
            <div class="word-option" onclick="playWordPhonics('dog')">D O G</div>
            <div class="word-option" onclick="playWordPhonics('sun')">S U N</div>
            <div class="word-option" onclick="playWordPhonics('bat')">B A T</div>
            <div class="word-option" onclick="playWordPhonics('pen')">P E N</div>
        </div>

        <audio id="correctSound" src="sounds/correct.mp3"></audio>
        <audio id="incorrectSound" src="sounds/incorrect.mp3"></audio>
        
        <script>
            const phonicsLetters = "abcdefghijklmnopqrstuvwxyz".split("");
            phonicsLetters.forEach(letter => {
                let audio = document.createElement("audio");
                audio.id = `phonicsSound${letter.toUpperCase()}`;
                audio.src = `sounds/phonics_${letter}.mp3`;
                document.body.appendChild(audio);
            });
            
            const wordSounds = {
                'cat': 'sounds/cat.mp3',
                'dog': 'sounds/dog.mp3',
                'sun': 'sounds/sun.mp3',
                'bat': 'sounds/bat.mp3',
                'pen': 'sounds/pen.mp3'
            };
        </script>
    </div>

    <script>
        function startEnglishZone() {
            document.getElementById("englishGame").style.display = "block";
        }

        function playSound(soundId) {
            document.getElementById(soundId).play();
        }

        function playWordPhonics(word) {
            let delay = 0;
            for (let letter of word) {
                setTimeout(() => playSound(`phonicsSound${letter.toUpperCase()}`), delay);
                delay += 800;
            }
            setTimeout(() => new Audio(wordSounds[word]).play(), delay + 500);
        }
    </script>
</body>
</html>
